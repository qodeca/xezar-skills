# #123 L5 proof jobs – .github/workflows/tmp-123-proof.yml on a throwaway tmp/123-l5 branch
# (never merged; design index §2, D3; design-L5 W5.0, W5.6). Push only on a tmp/123-* branch.
# In the same commit, copy the scratchpad tools to the branch:
#   scratchpad/l5/tools/before-after.mjs -> tmp-123/before-after.mjs
#   scratchpad/l5/tools/gate-runs.mjs    -> tmp-123/gate-runs.mjs (the L3 tool, unchanged)
# BEFORE is develop as L5 branched from it (46cf9f2, after L1–L4); the "after" side is this branch.
# Expected results are in the comment after each job; record each job's duration (W5.5).
name: tmp 123 proof (L5)

on:
  push:
    branches: ['tmp/123-*']

permissions:
  contents: read

env:
  BEFORE: 46cf9f20131fbffe2b1a30c65310e06f110800e9

jobs:
  guards-linux:                     # G3, G5: the full suite, N19, N29 and the two other new breaks included
    if: startsWith(github.ref_name, 'tmp/123-')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: nproc
      - run: node scripts/test-guards.mjs --list
      - run: node scripts/test-guards.mjs
# Pass: "test-guards: 425 cases on 4 worker(s) …; 5 exclusive cases run last, alone", the timing
# tables, "Ran 425 cases on 4 worker(s); wall time <W> s", "Guard suite OK (426 deliberate defects
# …)". The four new cases are #422–#425 (block 123-cheaper: a lost group result, a group exiting
# non-zero with no failure, a write into the template, a group two tasks need); #347 (the ordered
# printer, now gate-runner's orderedOutput) and #346 (the deps-units needs entry) have new anchors.
# G3: <W> and the job ≤ 10 minutes. W5.5: the job duration sets the nightly `guards` timeout.

  guards-windows:                   # G3 on Windows (informational); W5.5's guards-windows timeout
    if: startsWith(github.ref_name, 'tmp/123-')
    runs-on: windows-latest
    timeout-minutes: 300
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: jq --version && nproc
      - run: node scripts/test-guards.mjs
# Expected: #89 and #335 fail "not for this reason" exactly as in the L2–L4 runs (USER is unset
# under Windows; the core.filemode=true leg runs off Windows only); every other case is caught,
# #422–#425 included: "guards: 2 of 426 guards did not catch their defect". Record the job
# duration and the wall line: 2 × the job duration sets the nightly guards-windows timeout.

  gate-timing-win:                  # G1 hosted: one --jobs 1 reference, then the default three times
    if: startsWith(github.ref_name, 'tmp/123-')
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: jq --version && nproc && node -e "console.log('availableParallelism', require('os').availableParallelism())"
      - run: node tmp-123/gate-runs.mjs . "$RUNNER_TEMP/gate" "--jobs 1" 3
      - name: Each run's table
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/gate/*.out; do echo "::group::$(basename "$f")"; sed -n '/^| # |/,$p' "$f"; echo "::endgroup::"; done
# Pass: "gate-runs: 3 of 3 runs equal to the reference", exit 0. Record the reference's seconds
# (--jobs 1), each run's wall line ("Ran with <J> jobs; wall time <W> s.") and the median of the
# three; the tables give deps-units' own seconds (it ran 690 s in L3's four-way load here on the
# dev PC; 3 lanes of its own now).

  deps-before-after:                # L5.1, L5.2, D41 on Linux and macOS: before vs after, every group alone
    if: startsWith(github.ref_name, 'tmp/123-')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: after
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BEFORE }}
          path: before
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: jq --version && node -e "console.log('availableParallelism', require('os').availableParallelism())"
      - name: The four heavy tests, before and after, three runs each, then every deps-units group alone
        run: node after/tmp-123/before-after.mjs before after "$RUNNER_TEMP/ba" --runs 3 --groups
      - name: Each run's output
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/ba/*.out; do echo "::group::$(basename "$f")"; cat "$f"; echo "::endgroup::"; done
# Pass: "before-after: every run passed and every output equals its before-output", exit 0.
# Record per script the before and after walls (median of 3), and the facts tail: before ≈ 55–60 s
# (the uncleared 60 s race timer, W5.0), after ≈ 0. deps-units: both sides name 181 assertions;
# after ≈ the gates-write group alone + start-up (Linux before ≈ 52 s, gates-write alone ≈ 27 s,
# proof run 37173550029). Every group alone exits 0 on both sides; XEZ_DEPS_TEST_ONLY=53 prints the
# same line before and after (46 assertions).
