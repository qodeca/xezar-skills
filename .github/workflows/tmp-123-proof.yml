# Temporary proof for #123 L2. Lives only on tmp/123-* branches; deleted after the run.
name: tmp 123 proof
on:
  push:
    branches: ['tmp/123-*']
permissions:
  contents: read
jobs:
  guards-linux:
    if: startsWith(github.ref_name, 'tmp/123-')
    runs-on: ubuntu-latest
    timeout-minutes: 60              # was 150 for L1; L2 projects about ten minutes
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: node scripts/test-guards.mjs --list
      - run: node scripts/test-guards.mjs   # pass: "Guard suite OK (344 deliberate defects …)"; keep both timing tables

  sections-alone-linux:             # W2.9: every section id alone once, counts compared with the full run
    if: startsWith(github.ref_name, 'tmp/123-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        script: [test-kit-facts.mjs, test-kit-catalog.mjs, test-upgrade.mjs, test-deps-units.mjs]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: node tmp-123/sections-alone.mjs . ${{ matrix.script }} "$RUNNER_TEMP/alone"   # pass: "<n> ids alone, 0 with a difference", exit 0

  guards-windows:                   # L2.6's Windows figure (optional; informational)
    if: startsWith(github.ref_name, 'tmp/123-')
    runs-on: windows-latest
    timeout-minutes: 300
    continue-on-error: true
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: node scripts/test-guards.mjs
        shell: bash
