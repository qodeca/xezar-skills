name: lint

on:
  push:
    branches: [main, develop]
  pull_request:
  # The develop branch merges through a merge queue, which runs required checks on this event.
  merge_group:

# Least privilege. This workflow only reads the tree and runs offline checks; it
# writes nothing back, so nothing beyond `contents: read` is granted. Without this
# block the job inherits the repository default, which is often write access to
# everything.
permissions:
  contents: read

# One run per ref. A push on top of a push cancels the older run rather than
# leaving two jobs racing to report on a ref that no longer exists.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    # Every check here is offline and the whole list runs in about three minutes. The guard suite
    # (scripts/test-guards.mjs) is not here: it runs nightly from nightly-guards.yml. The timeout
    # is twice the slowest of the last five PR runs, rounded up to 5 minutes and at least 10
    # (#123): 178 s (run 37236704110; the others 175, 176, 138 and 171 s – runs 37218662088,
    # 37187269751, 37159637632, 37158664926). A job still running after it is hung, not slow, and
    # should fail rather than hold a runner.
    timeout-minutes: 10
    steps:
      # Pinned by commit sha, not by tag: a tag is mutable, so `@v4` means "whatever
      # that tag points at when this runs" — a supply-chain decision taken by someone
      # else, after review. The comment records the human-readable version.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Frontmatter, portability, safety and per-run load gates
        run: bash scripts/lint.sh
      - name: Browser provider contract and platform matrix
        run: node scripts/test-browser-providers.mjs
      - name: Tracker provider contract and compatibility invariants
        run: node scripts/test-tracker-providers.mjs
      - name: Toolchain and security provider contract
        run: node scripts/test-toolchain-providers.mjs
      - name: Merge-gate decision contract
        run: node scripts/test-merge-gate.mjs
      - name: Gate status decision contract
        run: node scripts/test-gate-status.mjs
      - name: Shared-block sync contract
        run: node scripts/test-shared-blocks.mjs
      - name: Chaining reference line grammar
        run: node scripts/test-chaining-lines.mjs
      - name: Pipeline-retro classifier rules
        run: node scripts/test-classify-runs.mjs
      - name: Close-keyword configurability contract
        run: node scripts/test-close-keywords.mjs
      - name: Onboarding native-token boundaries and client templates
        run: node scripts/test-onboarding-content.mjs
      - name: Cross-reference and anchor resolution
        run: node scripts/check-links.mjs
      - name: Gate-list binding (config, workflow, SDLC, package scripts)
        run: node scripts/check-gate-list.mjs
      - name: Changed-files map for the quick local check (T0)
        run: node scripts/check-gate-map.mjs
      - name: Label taxonomy recorded as data
        run: node scripts/check-label-taxonomy.mjs
      - name: Kit facts
        run: node scripts/test-kit-facts.mjs
      - name: Kit catalog loads, is routed and is counted right
        run: node scripts/test-kit-catalog.mjs
      - name: Kit bootstrap keeps only base-branch files
        run: node scripts/test-bootstrap.mjs
      - name: Dependency units install what the base branch lists, and a single root is unchanged
        run: node scripts/test-deps-units.mjs
      - name: One minimum engine version, and the bootstrap prompt keeps its rules
        run: node scripts/test-compat-pins.mjs
      - name: Allowlist shape, owners and expiry dates
        run: node scripts/check-allowlists.mjs
      - name: Upgrade tool classifies, applies and verifies the committed fixtures
        run: node scripts/test-upgrade.mjs
      - name: Generic instruction content (P6 skills and all companions)
        run: npm run check:generic-instructions
      - name: Generic instruction guard rejection and control cases
        run: npm run test:generic-instructions

  # Cross-platform signal (#122). A NEW, non-required job: branch protection reads the `lint`
  # check above by name, so it is not renamed or folded in. Windows and macOS on Node 22 (the
  # floor) and lts/*, informational (continue-on-error, fail-fast off) until the Windows runs are
  # proven stable. One step runs every command in .xezar/pipeline/config.json, so this job cannot
  # drift from the gate. The timeouts are twice the slowest measured job, rounded up to 5 minutes
  # (#123): Windows 406 s and macOS 160 s (run 37236704110, the slowest of the parallel-gate PR runs
  # 37218662088 and 37236704110). TBD(#123 L5 proof: re-take both from the L5 PR's own runs).
  cross-platform:
    name: Cross-platform gate (${{ matrix.os }}, Node ${{ matrix.node }})
    if: github.event_name != 'merge_group'
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, node: '22', timeout: 15 }
          - { os: windows-latest, node: 'lts/*', timeout: 15 }
          - { os: macos-latest, node: '22', timeout: 10 }
          - { os: macos-latest, node: 'lts/*', timeout: 10 }
    defaults:
      run:
        shell: bash
    steps:
      # Worktrees and node_modules nest deep. Set before checkout so the checkout uses it too.
      - name: Allow long paths in Git (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Tools the kit scripts need
        run: jq --version
      - name: Every validation command, up to four at once
        run: node scripts/run-gate.mjs
