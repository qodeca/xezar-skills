name: agent-browser pin

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-pin:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit sha, as in lint.yml: a tag is mutable. PRs land on develop
      # (.xezar/pipeline/config.json's baseBranch), so the bump starts from it and targets it.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: develop
      - name: Check the pinned release against latest stable
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          node scripts/bump-agent-browser.mjs --check
          code=$?
          set -e
          case "$code" in
            0) echo "stale=false" >> "$GITHUB_OUTPUT" ;;
            20) echo "stale=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac
      - name: Open a bump PR
        if: steps.check.outputs.stale == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh pr list --state open --head chore/bump-agent-browser --json number --jq length)" != "0" ]; then
            echo "A bump PR is already open; nothing to do."
            exit 0
          fi
          node scripts/bump-agent-browser.mjs
          tag=$(node scripts/bump-agent-browser.mjs --latest-tag)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b chore/bump-agent-browser
          # The script writes the canonical descriptor, its kit copy and the kit's digest pin;
          # a PR with only the first fails the gate on the other two.
          git add skills/xez-setup-agent-pipeline/references/browsers/agent-browser.md \
            skills/xez-onboard-opinionated/kit/pipeline/browsers/agent-browser.md \
            skills/xez-onboard-opinionated/references/descriptor-digests.json
          git commit -m "chore(xez-setup-agent-pipeline): bump pinned agent-browser to $tag"
          git push -f origin chore/bump-agent-browser
          gh pr create \
            --base develop \
            --head chore/bump-agent-browser \
            --title "chore: bump pinned agent-browser to $tag" \
            --body "Weekly pin refresh: the descriptor's pinned \`agent-browser\` release is behind the latest stable release. This PR moves the pin to **$tag** and updates every recorded SHA-256 asset sum from the release's asset digests. Generated by the \`agent-browser pin\` workflow; review and merge to ship the new pin with the next skills release."
