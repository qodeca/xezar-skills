# The guard suite (scripts/test-guards.mjs) breaks every gate on purpose to prove it still
# fires. It runs here once a night instead of on every PR (owner decision 2026-09-27; see
# DECISIONS.md -> "The guard suite runs nightly"); since #123 each case re-runs only the part of a
# test it breaks, on several workers in private copies of the tree, and the suite takes about
# four minutes on GitHub's Linux runner. A second job
# runs the same suite on native Windows (#122); it never fails the run, but a failure there opens
# (or updates) an issue of its own.
#
# When this starts firing: GitHub runs scheduled workflows only from the repository's
# default branch (main). This file reaches main with the 3.1.0 release; until then the
# schedule does nothing. `workflow_dispatch` (a manual run from the Actions tab) likewise
# works only once the file is on main.
name: nightly guards

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# Least privilege: the suite runs with read rights only; the report job alone may write issues.
permissions:
  contents: read

concurrency:
  group: nightly-guards
  cancel-in-progress: false

jobs:
  guards:
    runs-on: ubuntu-latest
    # The suite took 70 minutes here on 2026-09-29 (309 breaks), before #123; since #123 it takes
    # about four. The timeout is twice the slowest Linux proof run of #123's L3–L5, rounded up to
    # 5 minutes: 248 s (run 37207062084; 37210372022, 37223649980, 37226374879 and 37226771741 were
    # 179–244 s; L5's proof runs 37245584471 and 37249191101, 181 and 245 s). A run still going
    # after it is hung, not slow.
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      # Same checkout as lint.yml (pinned by commit sha). The suite checks the integration
      # branch, where PRs land: `develop` is .xezar/pipeline/config.json's baseBranch. A
      # workflow cannot read that file before checking out, so it is named here — change both
      # together.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: develop
          persist-credentials: false

      - id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Guard suite (every gate broken on purpose)
        run: node scripts/test-guards.mjs

  # The same suite on native Windows (#122), informational: it never fails the run, and a failure
  # reaches `report` through the `failed` output, which opens a Windows issue of its own. The owner kept it on (2026-09-29) while
  # #123 made the suite faster: it could not finish within the 240 minutes it had (about 16 hours
  # projected), and now takes 20–25 on GitHub's Windows runner. The timeout is twice the slowest
  # proof run, rounded up to 5 minutes: 1,491 s (L5's run 37249191101; 37207062084, 37210372022,
  # 37223649980, 37226374879, 37226771741 and 37245584471 were 1,199–1,424 s).
  guards-windows:
    runs-on: windows-latest
    timeout-minutes: 50
    continue-on-error: true
    # The step's own outcome: with continue-on-error the job's result reads as success, so this
    # output is how `report` learns that a Windows-only guard failed.
    outputs:
      failed: ${{ steps.suite.outcome == 'failure' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Allow long paths in Git
        run: git config --global core.longpaths true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: develop
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: jq --version
      - name: Guard suite (every gate broken on purpose)
        id: suite
        continue-on-error: true
        run: node scripts/test-guards.mjs

  # One issue per platform: a Linux failure fails the run; a Windows failure (or a Windows job that
  # never finished) is reported without failing it.
  report:
    needs: [guards, guards-windows]
    if: >-
      always() && (needs.guards.result == 'failure' || needs.guards.result == 'cancelled' ||
      needs.guards-windows.outputs.failed == 'true' || needs.guards-windows.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # One open issue, however many nights in a row it fails: find it and comment, or open it.
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.guards.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LINUX_FAILED: ${{ needs.guards.result == 'failure' || needs.guards.result == 'cancelled' }}
          WINDOWS_FAILED: ${{ needs.guards-windows.outputs.failed == 'true' || needs.guards-windows.result == 'failure' }}
        run: |
          report() {
            local title="$1" where="$2" number body
            body="The nightly guard suite (\`node scripts/test-guards.mjs\`) failed ${where} on \`develop\` at ${SHA:-its head}. A guard may no longer catch the defect it was written for. Run log: ${RUN_URL}"
            number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
              --jq "map(select(.title == \"$title\")) | .[0].number // empty")
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          }
          if [ "$LINUX_FAILED" = true ]; then report "Nightly guard suite failed" "on Linux"; fi
          if [ "$WINDOWS_FAILED" = true ]; then report "Nightly guard suite failed on Windows" "on native Windows"; fi
