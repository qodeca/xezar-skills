# The guard suite (scripts/test-guards.mjs) breaks every gate on purpose to prove it still
# fires. It takes about twenty-five minutes, so it runs here once a night instead of on every
# PR (owner decision 2026-09-27; see DECISIONS.md -> "The guard suite runs nightly").
#
# When this starts firing: GitHub runs scheduled workflows only from the repository's
# default branch (main). This file reaches main with the 3.1.0 release; until then the
# schedule does nothing. `workflow_dispatch` (a manual run from the Actions tab) likewise
# works only once the file is on main.
name: nightly guards

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# Least privilege: the suite runs with read rights only; the report job alone may write issues.
permissions:
  contents: read

concurrency:
  group: nightly-guards
  cancel-in-progress: false

jobs:
  guards:
    runs-on: ubuntu-latest
    # The suite takes about twenty-five minutes and grows with every guard; a run still going
    # after forty-five is hung, not slow.
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      # Same checkout as lint.yml (pinned by commit sha). The suite checks the integration
      # branch, where PRs land: `develop` is .xezar/pipeline/config.json's baseBranch. A
      # workflow cannot read that file before checking out, so it is named here — change both
      # together.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: develop
          persist-credentials: false

      - id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Guard suite (every gate broken on purpose)
        run: node scripts/test-guards.mjs

  report:
    needs: guards
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # One open issue, however many nights in a row it fails: find it and comment, or open it.
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.guards.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly guard suite failed"
          body="The nightly guard suite (\`node scripts/test-guards.mjs\`) failed on \`develop\` at ${SHA}. A guard may no longer catch the defect it was written for. Run log: ${RUN_URL}"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
