# Checks a finished change against each accepted criterion of its issue, by running it.
# Read-only: no setup, no gates, no commits. The result is one PR comment headed "## Acceptance".
# It is not QA – it posts no "## QA" comment and moves no label – and it is not the owner's
# acceptance, which only the owner gives.
name: acceptance-verification
description: "Check a finished change against each acceptance criterion of its issue by running it – one verdict and repeatable evidence per criterion, plus what was done that nobody asked for. One comment naming the exact head SHA. Read-only, never by the author's lane."
steps:
  - id: kit
    name: Snapshot the local project kit
    command: 'bash "$(git rev-parse --path-format=absolute --git-common-dir)/../.xezar/checks/bootstrap.sh"'
    resultScope: routine
  - id: preflight
    name: Report the checkout
    command: ".xezar/checks/worktree-preflight.sh --allow-root"
    resultScope: routine
  - id: verify
    name: Acceptance verification
    prompt: "Acceptance verification: {{task}}. Follow xezar-acceptance instructions. List the issue's accepted criteria first, word for word; if there are none that can be checked, say so and stop – never write your own. Check out the PR's head in your own prepared checkout and run it. Give each criterion one verdict – MET, NOT MET, PARTLY MET, NOT VERIFIABLE HERE – with evidence somebody else can repeat, then say what the change does that nobody asked for. Confirm from the run record that your lane and account differ from the author's; if not, say so and stop. Post exactly one comment headed '## Acceptance' with the full head SHA. Post no QA comment, move no label, fix nothing."
    skill: xezar-acceptance
    allowedTools: [Read, Grep, Glob, Bash]
