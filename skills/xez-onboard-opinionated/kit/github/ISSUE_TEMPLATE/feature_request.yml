name: Feature request
description: Suggest a change to what {{PRODUCT}} does.
labels: ['feature']
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The behaviour you want. An example of what it looks like in use helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Workarounds or other tools you considered.
    validations:
      required: false
  - type: dropdown
    id: surface
    attributes:
      label: Does this change what a user sees?
      description: Yes means the maintainer applies `needs-design` at triage and the work starts with a proposal in `designs/<feature>/`.
      options:
        - 'Yes'
        - 'No'
        - 'Not sure'
    validations:
      required: false
